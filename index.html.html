<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Godel Market · App — Marketplace + PIX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1F1A;
    --panel:#132C24;
    --panel-2:#0F241D;
    --line:#25423A;
    --green:#4FA672;
    --green-dim:#2E5342;
    --amber:#E8A33D;
    --red:#C9614A;
    --text:#EDEAE2;
    --text-dim:#8FA69B;
    --mono:'IBM Plex Mono', monospace;
    --display:'Space Grotesk', sans-serif;
    --body:'Inter', sans-serif;
    --radius:8px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    height:100vh;
    overflow:hidden;
  }
  button{font-family:var(--body); cursor:pointer; border:none;}
  ::selection{background:var(--green); color:var(--bg);}

  .app{
    display:grid;
    grid-template-columns:220px 1fr;
    height:100vh;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    background:var(--panel-2);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    padding:22px 16px;
  }
  .brand{
    font-family:var(--display);
    font-weight:700;
    font-size:1.05rem;
    letter-spacing:0.02em;
    padding:0 8px 24px;
    border-bottom:1px solid var(--line);
    margin-bottom:18px;
  }
  .brand span{color:var(--green);}
  .navlist{list-style:none; flex:1;}
  .navlist li{margin-bottom:4px;}
  .navlist button{
    width:100%;
    display:flex; align-items:center; gap:12px;
    background:transparent;
    color:var(--text-dim);
    font-size:0.88rem;
    padding:10px 12px;
    border-radius:6px;
    text-align:left;
    transition:background 0.15s, color 0.15s;
  }
  .navlist button .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--text-dim);
    flex-shrink:0;
  }
  .navlist button:hover{background:rgba(79,166,114,0.08); color:var(--text);}
  .navlist button.active{background:rgba(79,166,114,0.14); color:var(--green);}
  .navlist button.active .dot{background:var(--green); box-shadow:0 0 0 3px rgba(79,166,114,0.2);}

  .sidebar-foot{
    border-top:1px solid var(--line);
    padding-top:16px;
    display:flex; align-items:center; gap:10px;
  }
  .avatar{
    width:32px; height:32px; border-radius:50%;
    background:linear-gradient(135deg, var(--green), var(--green-dim));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--display); font-weight:700; font-size:0.8rem;
  }
  .sidebar-foot .who{font-size:0.8rem;}
  .sidebar-foot .role{font-size:0.7rem; color:var(--text-dim);}

  /* ---------- MAIN ---------- */
  main{
    display:flex; flex-direction:column;
    height:100vh;
    overflow:hidden;
  }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .topbar h1{
    font-family:var(--display); font-size:1.15rem; font-weight:600;
  }
  .topbar .sub{font-size:0.78rem; color:var(--text-dim); margin-top:2px;}

  .wallet{
    display:flex; align-items:center; gap:14px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:100px;
    padding:8px 8px 8px 18px;
  }
  .wallet .label{font-size:0.68rem; color:var(--text-dim); letter-spacing:0.04em; text-transform:uppercase;}
  .wallet .amount{font-family:var(--mono); font-size:0.95rem; color:var(--amber);}
  .wallet button{
    background:var(--green);
    color:var(--bg);
    font-weight:600;
    font-size:0.78rem;
    padding:8px 16px;
    border-radius:100px;
  }

  .content{
    flex:1;
    overflow-y:auto;
    padding:24px 28px 40px;
  }
  .view{display:none;}
  .view.active{display:block; animation:fade 0.25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .section-title{
    font-family:var(--display); font-weight:600; font-size:1rem;
    margin-bottom:14px; color:var(--text);
  }

  /* ---- ticker strip ---- */
  .ticker-strip{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:12px;
    margin-bottom:28px;
  }
  @media (max-width:1000px){.ticker-strip{grid-template-columns:repeat(2,1fr);}}
  .tick-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .tick-card .mat{
    font-family:var(--mono); font-size:0.7rem; color:var(--text-dim); letter-spacing:0.06em;
  }
  .tick-card .price{
    font-family:var(--mono); font-size:1.15rem; margin-top:6px; transition:color 0.3s;
  }
  .tick-card .delta{
    font-family:var(--mono); font-size:0.72rem; margin-top:4px;
  }
  .up{color:var(--green);} .down{color:var(--red);}

  /* ---- marketplace grid ---- */
  .grid-cards{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
  }
  @media (max-width:900px){.grid-cards{grid-template-columns:repeat(2,1fr);}}
  .listing{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    display:flex; flex-direction:column; gap:10px;
  }
  .listing .top-row{display:flex; justify-content:space-between; align-items:flex-start;}
  .listing .name{font-family:var(--display); font-weight:600; font-size:0.98rem;}
  .listing .qty{font-size:0.76rem; color:var(--text-dim);}
  .badge{
    font-family:var(--mono); font-size:0.65rem;
    background:rgba(79,166,114,0.14); color:var(--green);
    padding:3px 8px; border-radius:100px;
  }
  .listing .price-row{
    display:flex; justify-content:space-between; align-items:center;
    border-top:1px dashed var(--line); padding-top:10px;
  }
  .listing .price-row .p{font-family:var(--mono); color:var(--amber); font-size:1rem;}
  .listing button{
    background:transparent; border:1px solid var(--green-dim); color:var(--green);
    font-size:0.78rem; padding:8px 12px; border-radius:6px; transition:background 0.15s;
  }
  .listing button:hover{background:rgba(79,166,114,0.1);}

  /* ---- auctions ---- */
  .auction-row{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr auto;
    gap:16px;
    align-items:center;
    margin-bottom:10px;
  }
  @media (max-width:900px){ .auction-row{grid-template-columns:1fr 1fr; row-gap:8px;} }
  .auction-row .name{font-family:var(--display); font-weight:600; font-size:0.94rem;}
  .auction-row .qty{font-size:0.75rem; color:var(--text-dim);}
  .auction-row .lbl{font-size:0.65rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em;}
  .auction-row .val{font-family:var(--mono); font-size:0.95rem; margin-top:2px;}
  .auction-row .val.bid{color:var(--amber);}
  .auction-row .val.time{color:var(--green);}
  .pujar-btn{
    background:var(--green); color:var(--bg); font-weight:600;
    font-size:0.8rem; padding:10px 16px; border-radius:6px;
    white-space:nowrap;
  }
  .pujar-btn:active{transform:scale(0.97);}

  /* ---- PIX view ---- */
  .pix-layout{
    display:grid;
    grid-template-columns:1.1fr 1fr;
    gap:24px;
  }
  @media (max-width:900px){ .pix-layout{grid-template-columns:1fr;} }

  .pix-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:24px;
  }
  .pix-tx{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .pix-tx:last-child{border-bottom:none;}
  .pix-tx .who{font-size:0.88rem;}
  .pix-tx .meta{font-size:0.7rem; color:var(--text-dim); margin-top:2px;}
  .pix-tx .amt{font-family:var(--mono); font-size:0.92rem;}
  .status-pill{
    font-family:var(--mono); font-size:0.62rem; padding:3px 8px; border-radius:100px;
    text-transform:uppercase; letter-spacing:0.04em;
  }
  .status-ok{background:rgba(79,166,114,0.14); color:var(--green);}
  .status-pend{background:rgba(232,163,61,0.14); color:var(--amber);}

  .qr-box{
    width:100%; aspect-ratio:1/1; max-width:200px; margin:0 auto 18px;
    background:
      repeating-linear-gradient(0deg, var(--text) 0 6px, transparent 6px 12px),
      repeating-linear-gradient(90deg, var(--text) 0 6px, transparent 6px 12px);
    background-blend-mode:multiply;
    opacity:0.9;
    border-radius:6px;
    position:relative;
  }
  .qr-box::before{
    content:"PIX";
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--display); font-weight:700; font-size:1.3rem;
    color:var(--bg); background:var(--text);
    width:56px; height:56px; margin:auto; border-radius:6px;
  }
  .confirm-btn{
    width:100%;
    background:var(--green); color:var(--bg); font-weight:600;
    padding:14px; border-radius:6px; font-size:0.92rem;
    margin-top:16px;
    transition:opacity 0.2s;
  }
  .confirm-btn:disabled{opacity:0.5; cursor:default;}
  .pay-amount{
    font-family:var(--mono); font-size:1.6rem; color:var(--amber);
    text-align:center; margin-bottom:4px;
  }
  .pay-label{text-align:center; font-size:0.75rem; color:var(--text-dim); margin-bottom:18px;}

  /* ---- trazabilidad ---- */
  .timeline{
    display:flex; flex-direction:column; gap:0;
  }
  .tl-step{
    display:flex; gap:16px; padding-bottom:26px; position:relative;
  }
  .tl-step:last-child{padding-bottom:0;}
  .tl-step::before{
    content:"";
    position:absolute; left:9px; top:22px; bottom:0;
    width:1px; background:var(--line);
  }
  .tl-step:last-child::before{display:none;}
  .tl-dot{
    width:20px; height:20px; border-radius:50%;
    border:2px solid var(--line);
    background:var(--panel-2);
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:0.6rem;
    z-index:1;
  }
  .tl-step.done .tl-dot{border-color:var(--green); background:var(--green); color:var(--bg);}
  .tl-step.active .tl-dot{border-color:var(--amber);}
  .tl-title{font-family:var(--display); font-weight:600; font-size:0.92rem;}
  .tl-meta{font-size:0.75rem; color:var(--text-dim); margin-top:2px;}

  /* toast */
  #toast{
    position:fixed; bottom:24px; right:28px;
    background:var(--panel); border:1px solid var(--green);
    color:var(--text); padding:14px 20px; border-radius:8px;
    font-size:0.85rem; display:flex; align-items:center; gap:10px;
    transform:translateY(20px); opacity:0; pointer-events:none;
    transition:all 0.3s ease;
    z-index:50;
  }
  #toast.show{transform:translateY(0); opacity:1;}
  #toast .dotok{width:8px; height:8px; border-radius:50%; background:var(--green);}

  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
</style>
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="brand">GODEL <span>MARKET</span></div>
    <ul class="navlist">
      <li><button class="active" data-view="marketplace"><span class="dot"></span>Marketplace</button></li>
      <li><button data-view="subastas"><span class="dot"></span>Subastas</button></li>
      <li><button data-view="pix"><span class="dot"></span>Pagos PIX</button></li>
      <li><button data-view="trazabilidad"><span class="dot"></span>Trazabilidad</button></li>
    </ul>
    <div class="sidebar-foot">
      <div class="avatar">LO</div>
      <div>
        <div class="who">Leonardo</div>
        <div class="role">Vendedor verificado</div>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <main>
    <div class="topbar">
      <div>
        <h1 id="viewTitle">Marketplace</h1>
        <div class="sub" id="viewSub">Materiales disponibles para compra directa</div>
      </div>
      <div class="wallet">
        <div>
          <div class="label">Saldo PIX</div>
          <div class="amount" id="walletAmount">B/. 4,320.15</div>
        </div>
        <button data-view="pix">Depositar</button>
      </div>
    </div>

    <div class="content">

      <!-- TICKER (shown on marketplace + subastas) -->
      <div class="ticker-strip" id="tickerStrip"></div>

      <!-- MARKETPLACE VIEW -->
      <div class="view active" id="view-marketplace">
        <div class="section-title">Publicaciones activas</div>
        <div class="grid-cards" id="marketGrid"></div>
      </div>

      <!-- SUBASTAS VIEW -->
      <div class="view" id="view-subastas">
        <div class="section-title">Subastas en curso</div>
        <div id="auctionList"></div>
      </div>

      <!-- PIX VIEW -->
      <div class="view" id="view-pix">
        <div class="pix-layout">
          <div class="pix-card">
            <div class="section-title" style="margin-bottom:16px;">Pagar con PIX</div>
            <div class="pay-amount" id="payAmount">B/. 640.00</div>
            <div class="pay-label" id="payLabel">Aluminio · Lote #A-2291 · 500 kg</div>
            <div class="qr-box"></div>
            <button class="confirm-btn" id="confirmPay">Confirmar pago PIX</button>
          </div>
          <div class="pix-card">
            <div class="section-title" style="margin-bottom:16px;">Movimientos recientes</div>
            <div id="txList"></div>
          </div>
        </div>
      </div>

      <!-- TRAZABILIDAD VIEW -->
      <div class="view" id="view-trazabilidad">
        <div class="section-title">Lote #A-2291 · Aluminio · 500 kg</div>
        <div class="timeline" id="timeline"></div>
      </div>

    </div>
  </main>
</div>

<div id="toast"><span class="dotok"></span><span id="toastMsg">Pago confirmado</span></div>

<script>
  /* ---------- state ---------- */
  const materials = [
    {code:'ALU', name:'Aluminio', price:182.40},
    {code:'CU',  name:'Cobre',    price:396.10},
    {code:'PET', name:'PET',      price:24.80},
    {code:'CART',name:'Cartón',  price:11.35},
    {code:'FE',  name:'Chatarra (Fe)', price:31.60},
  ];

  const tickerStrip = document.getElementById('tickerStrip');
  materials.forEach(m=>{
    const el = document.createElement('div');
    el.className = 'tick-card';
    el.innerHTML = `
      <div class="mat">${m.code}</div>
      <div class="price" data-code="${m.code}">B/. ${m.price.toFixed(2)}</div>
      <div class="delta up" data-delta="${m.code}">▲ 0.00%</div>`;
    tickerStrip.appendChild(el);
  });

  function tickPrices(){
    materials.forEach(m=>{
      const changePct = (Math.random()-0.5) * 1.6;
      m.price = Math.max(4, m.price * (1 + changePct/100));
      const priceEl = document.querySelector(`.price[data-code="${m.code}"]`);
      const deltaEl = document.querySelector(`.delta[data-delta="${m.code}"]`);
      priceEl.textContent = 'B/. ' + m.price.toFixed(2);
      const up = changePct >= 0;
      deltaEl.textContent = (up?'▲ ':'▼ ') + Math.abs(changePct).toFixed(2) + '%';
      deltaEl.className = 'delta ' + (up?'up':'down');
    });
  }
  tickPrices();
  setInterval(tickPrices, 2200);

  /* ---------- marketplace listings ---------- */
  const listings = [
    {name:'Aluminio', qty:'500 kg', code:'ALU', lote:'A-2291'},
    {name:'Cobre',    qty:'120 kg', code:'CU',  lote:'C-1187'},
    {name:'PET',      qty:'800 kg', code:'PET', lote:'P-0043'},
    {name:'Cartón',   qty:'1,200 kg', code:'CART', lote:'K-3390'},
    {name:'Chatarra (Fe)', qty:'2,000 kg', code:'FE', lote:'F-7710'},
    {name:'Aluminio', qty:'150 kg', code:'ALU', lote:'A-2308'},
  ];
  const marketGrid = document.getElementById('marketGrid');
  listings.forEach(l=>{
    const mat = materials.find(m=>m.code===l.code);
    const card = document.createElement('div');
    card.className = 'listing';
    card.innerHTML = `
      <div class="top-row">
        <div>
          <div class="name">${l.name}</div>
          <div class="qty">Lote #${l.lote} · ${l.qty}</div>
        </div>
        <span class="badge">Verificado</span>
      </div>
      <div class="price-row">
        <div class="p">B/. ${mat.price.toFixed(2)} /kg</div>
        <button data-lote="${l.lote}" data-name="${l.name}" data-qty="${l.qty}">Comprar</button>
      </div>`;
    marketGrid.appendChild(card);
  });
  marketGrid.addEventListener('click', e=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    openPixFor(btn.dataset.name, btn.dataset.lote, btn.dataset.qty, 'compra');
  });

  /* ---------- auctions ---------- */
  const auctions = [
    {name:'Aluminio', qty:'500 kg', bid:640.00, time:184, lote:'A-2291'},
    {name:'Cobre', qty:'120 kg', bid:475.20, time:92, lote:'C-1187'},
    {name:'PET', qty:'800 kg', bid:198.00, time:301, lote:'P-0043'},
  ];
  const auctionList = document.getElementById('auctionList');
  function renderAuctions(){
    auctionList.innerHTML = '';
    auctions.forEach((a,i)=>{
      const row = document.createElement('div');
      row.className = 'auction-row';
      const mins = Math.floor(a.time/60), secs = a.time%60;
      row.innerHTML = `
        <div>
          <div class="name">${a.name}</div>
          <div class="qty">Lote #${a.lote} · ${a.qty}</div>
        </div>
        <div>
          <div class="lbl">Puja actual</div>
          <div class="val bid">B/. ${a.bid.toFixed(2)}</div>
        </div>
        <div>
          <div class="lbl">Incremento</div>
          <div class="val">B/. 5.00</div>
        </div>
        <div>
          <div class="lbl">Tiempo</div>
          <div class="val time">${mins}:${secs.toString().padStart(2,'0')}</div>
        </div>
        <button class="pujar-btn" data-i="${i}">Pujar</button>`;
      auctionList.appendChild(row);
    });
  }
  renderAuctions();
  auctionList.addEventListener('click', e=>{
    const btn = e.target.closest('.pujar-btn');
    if(!btn) return;
    const a = auctions[btn.dataset.i];
    a.bid += 5;
    renderAuctions();
    showToast(`Nueva puja registrada: B/. ${a.bid.toFixed(2)} — ${a.name}`);
  });
  setInterval(()=>{
    auctions.forEach(a=>{ if(a.time>0) a.time--; });
    renderAuctions();
  }, 1000);

  /* ---------- PIX payment flow ---------- */
  const txList = document.getElementById('txList');
  let transactions = [
    {who:'Recicladora del Istmo', meta:'Lote #F-7710 · hace 2 h', amt:'B/. 620.00', status:'ok'},
    {who:'Metales Vega', meta:'Lote #C-1140 · ayer', amt:'B/. 1,180.50', status:'ok'},
    {who:'EcoPapel S.A.', meta:'Lote #K-3390 · ayer', amt:'B/. 132.00', status:'pend'},
  ];
  function renderTx(){
    txList.innerHTML = '';
    transactions.forEach(t=>{
      const row = document.createElement('div');
      row.className = 'pix-tx';
      row.innerHTML = `
        <div>
          <div class="who">${t.who}</div>
          <div class="meta">${t.meta}</div>
        </div>
        <div style="text-align:right;">
          <div class="amt">${t.amt}</div>
          <span class="status-pill ${t.status==='ok'?'status-ok':'status-pend'}">${t.status==='ok'?'Confirmado':'Pendiente'}</span>
        </div>`;
      txList.appendChild(row);
    });
  }
  renderTx();

  let currentPayment = {name:'Aluminio', lote:'A-2291', qty:'500 kg', amount:640.00};
  function openPixFor(name, lote, qty, kind){
    const mat = materials.find(m => name.includes(m.name.split(' ')[0]));
    const amount = mat ? (parseFloat(qty) * mat.price / (kind==='compra'?1:1)) : 300;
    currentPayment = {name, lote, qty, amount: Math.min(amount, 4000)};
    document.getElementById('payAmount').textContent = 'B/. ' + currentPayment.amount.toFixed(2);
    document.getElementById('payLabel').textContent = `${name} · Lote #${lote} · ${qty}`;
    document.getElementById('confirmPay').disabled = false;
    document.getElementById('confirmPay').textContent = 'Confirmar pago PIX';
    switchView('pix');
  }

  document.getElementById('confirmPay').addEventListener('click', function(){
    this.disabled = true;
    this.textContent = 'Procesando…';
    setTimeout(()=>{
      this.textContent = 'Pago confirmado ✓';
      transactions.unshift({
        who: currentPayment.name + ' · ' + currentPayment.qty,
        meta: `Lote #${currentPayment.lote} · ahora`,
        amt: 'B/. ' + currentPayment.amount.toFixed(2),
        status:'ok'
      });
      renderTx();
      advanceTimeline();
      showToast('Pago PIX confirmado — trazabilidad actualizada');
      const wallet = document.getElementById('walletAmount');
      const current = parseFloat(wallet.textContent.replace('B/. ','').replace(',',''));
      wallet.textContent = 'B/. ' + (current - currentPayment.amount).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
    }, 1100);
  });

  /* ---------- trazabilidad ---------- */
  const steps = [
    {title:'Publicado en marketplace', meta:'Recicladora del Istmo — origen registrado', state:'done'},
    {title:'Subasta cerrada', meta:'Puja ganadora B/. 620.00', state:'done'},
    {title:'Pago PIX', meta:'Pendiente de confirmación', state:'active'},
    {title:'Recolección y transporte', meta:'En espera de pago', state:'pending'},
    {title:'Entrega y verificación final', meta:'En espera', state:'pending'},
  ];
  const timelineEl = document.getElementById('timeline');
  function renderTimeline(){
    timelineEl.innerHTML = '';
    steps.forEach(s=>{
      const step = document.createElement('div');
      step.className = 'tl-step ' + (s.state==='done'?'done':(s.state==='active'?'active':''));
      step.innerHTML = `
        <div class="tl-dot">${s.state==='done'?'✓':''}</div>
        <div>
          <div class="tl-title">${s.title}</div>
          <div class="tl-meta">${s.meta}</div>
        </div>`;
      timelineEl.appendChild(step);
    });
  }
  renderTimeline();
  function advanceTimeline(){
    const pixStep = steps.find(s=>s.title==='Pago PIX');
    if(pixStep && pixStep.state !== 'done'){
      pixStep.state = 'done';
      pixStep.meta = 'Confirmado vía PIX';
      const transportStep = steps.find(s=>s.title==='Recolección y transporte');
      transportStep.state = 'active';
      transportStep.meta = 'Transportista asignado';
    }
    renderTimeline();
  }

  /* ---------- nav / views ---------- */
  const titles = {
    marketplace: ['Marketplace', 'Materiales disponibles para compra directa'],
    subastas: ['Subastas', 'Puja en tiempo real sobre lotes activos'],
    pix: ['Pagos PIX', 'Liquidación instantánea de operaciones'],
    trazabilidad: ['Trazabilidad', 'Seguimiento del material de origen a destino'],
  };
  function switchView(name){
    document.querySelectorAll('.navlist button').forEach(b=>b.classList.toggle('active', b.dataset.view===name));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+name).classList.add('active');
    document.getElementById('tickerStrip').style.display = (name==='marketplace'||name==='subastas') ? 'grid' : 'none';
    document.getElementById('viewTitle').textContent = titles[name][0];
    document.getElementById('viewSub').textContent = titles[name][1];
  }
  document.querySelectorAll('[data-view]').forEach(el=>{
    el.addEventListener('click', ()=> switchView(el.dataset.view));
  });

  /* ---------- toast ---------- */
  let toastTimer;
  function showToast(msg){
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> t.classList.remove('show'), 3200);
  }
</script>

</body>
</html>
